<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e5eee2">
<title>Ø黃金比例呼吸法 2.0｜閉眼呼吸引導</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;color:#40533f;background:linear-gradient(180deg,#eef5ec,#dce8d8)}body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:18px}.app{width:100%;max-width:680px;min-height:88vh;padding:clamp(24px,6vw,48px);text-align:center;border-radius:32px;background:rgba(255,255,255,.4);backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(90,120,80,.18);display:flex;flex-direction:column;justify-content:center}h1{margin:0 0 10px;font-size:clamp(25px,7vw,40px);letter-spacing:.03em}.subtitle{font-size:clamp(14px,3.8vw,18px);color:#6d8068;margin-bottom:clamp(28px,7vw,48px);line-height:1.7}.circle-wrap{height:clamp(190px,54vw,310px);display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:16px}.circle{width:clamp(150px,42vw,260px);height:clamp(150px,42vw,260px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8cf,#f3d98a 28%,#a8c99f 60%,#7fac79 100%);box-shadow:0 0 35px rgba(255,235,170,.75),0 0 90px rgba(145,190,130,.55);transform:scale(.72);will-change:transform,opacity;transition:background .65s,box-shadow .65s}.circle.exhale{background:radial-gradient(circle at 35% 30%,#dfe4d9,#b3c0b5 38%,#899b92 72%,#72867e 100%);box-shadow:0 0 35px rgba(147,162,154,.35),0 0 80px rgba(130,145,140,.22)}.mist{position:absolute;z-index:0;width:45%;height:45%;border-radius:50%;background:radial-gradient(circle,rgba(111,122,124,.30),rgba(145,156,153,.12) 48%,transparent 72%);filter:blur(15px);opacity:0;transform:scale(.8);pointer-events:none;will-change:transform,opacity}.circle{z-index:1}.breath-text{font-size:clamp(28px,8vw,44px);font-weight:700;margin-bottom:12px}.guide{font-size:clamp(16px,4vw,21px);line-height:1.8;color:#526950;min-height:80px}.info{margin-top:16px;font-size:clamp(13px,3vw,15px);color:#7b8d76}.status{font-size:13px;color:#71836e;min-height:20px;margin-top:9px}.controls{margin-top:24px;padding:16px;border-radius:18px;background:rgba(255,255,255,.38);display:grid;gap:13px;text-align:left}.controls label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}.controls input{width:48%;accent-color:#72956f}.buttons{margin-top:22px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}button{border:none;border-radius:999px;padding:12px 20px;font-size:clamp(14px,3.5vw,16px);color:#40533f;background:rgba(255,255,255,.8);box-shadow:0 8px 24px rgba(80,110,70,.13);cursor:pointer}button.primary{background:#55795b;color:white}button:hover{filter:brightness(1.04)}button:focus-visible,input:focus-visible{outline:3px solid #507957;outline-offset:3px}.note{margin-top:16px;color:#73836f;font-size:12px;line-height:1.7}.credit-box{margin-top:25px;padding-top:17px;border-top:1px solid rgba(100,120,90,.25);font-size:clamp(12px,2.8vw,14px);line-height:1.8;color:#6f806d}.credit-box p{margin:4px 0}@media(max-width:480px){body{padding:0;align-items:stretch}.app{width:100%;min-height:100dvh;border-radius:0;padding:28px 20px}.guide{min-height:90px}.buttons{display:grid;grid-template-columns:1fr 1fr}.buttons button.primary{grid-column:1/-1}}@media(prefers-reduced-motion:reduce){.circle,.mist{transition:none}}
</style>
</head>
<body>
<main class="app">
<h1>Ø黃金比例呼吸法</h1>
<div class="subtitle">Ø-breath 2.0｜閉眼呼吸引導版<br>跟著光與聲音，慢慢回到身體裡</div>
<div class="circle-wrap"><div class="mist" id="mist" aria-hidden="true"></div><div class="circle" id="circle" aria-hidden="true"></div></div>
<div class="breath-text" id="breathText">準備開始</div>
<div class="guide" id="guideText">想像植物的清新氣息，<br>正溫柔地進入你的身體。</div>
<div class="info">吸氣 4 秒｜吐氣 6.5 秒｜每輪 10.5 秒</div>
<div class="status" id="status" role="status">按「開始呼吸」後，即可閉眼跟隨聲音</div>
<div class="controls" aria-label="音量設定">
<label for="musicVolume">背景音樂 <input id="musicVolume" type="range" min="0" max="100" value="35"></label>
<label for="cueVolume">高低音提示 <input id="cueVolume" type="range" min="0" max="100" value="65"></label>
<label for="tickVolume">秒數節拍 <input id="tickVolume" type="range" min="0" max="100" value="30"></label>
</div>
<div class="buttons"><button class="primary" id="startBtn" type="button">開始呼吸</button><button id="musicBtn" type="button">開啟背景音樂 🌿</button><button id="restartBtn" type="button">重新開始</button></div>
<div class="note">吸氣：清亮高音＋柔和節拍　｜　吐氣：溫暖低音＋柔和節拍<br>若感到不適或頭暈，請停止練習並恢復自然呼吸。</div>
<div class="credit-box"><p>Ø黃金比例呼吸法（Ø-breath）</p><p>此呼吸法來自 IAA 協會理事長 王有綱老師 開創教授</p><p>此網頁由許茗惠 Ming-Hui Hsu 製作</p><p>2.0 閉眼呼吸引導測試版</p></div>
<audio id="bgMusic" preload="none" loop src="music.mp3"></audio>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const circle=$('circle'),mist=$('mist'),label=$('breathText'),guide=$('guideText'),status=$('status'),music=$('bgMusic'),startBtn=$('startBtn'),musicBtn=$('musicBtn');
const IN=4,OUT=6.5,PERIOD=IN+OUT;
let ctx=null,master=null,active=[],running=false,elapsed=0,origin=0,nextCycle=0,raf=0,scheduler=0,musicEnabled=false,runToken=0,lastPhase='';
const volume=id=>Number($(id).value)/100;
function initAudio(){const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)throw new Error('此瀏覽器不支援 Web Audio');ctx=new AudioContextClass();master=ctx.createGain();master.gain.value=.65;master.connect(ctx.destination);}
function tone(t,f,d,level,overtones=false){if(!ctx||level<=0)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.00001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,level),t+.035);g.gain.exponentialRampToValueAtTime(.00001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);active.push(o);o.onended=()=>{active=active.filter(x=>x!==o);o.disconnect();g.disconnect()};if(overtones)tone(t,f*1.5,d*.65,level*.12,false)}
function cue(t,inhale){const level=volume('cueVolume')*.16;tone(t,inhale?659.25:220,inhale?1.15:1.85,level,true)}
function ticks(t,d,inhale){const level=volume('tickVolume')*.055;for(let k=1;k<d;k++)tone(t+k,inhale?460:250,.14,level)}
function schedule(){if(!running||!ctx)return;const now=ctx.currentTime;while(origin+nextCycle*PERIOD<now+.42){const t=origin+nextCycle*PERIOD;if(t>=now-.035){cue(t,true);ticks(t,IN,true)}if(t+IN>=now-.035){cue(t+IN,false);ticks(t+IN,OUT,false)}nextCycle++}}
function render(){if(!running||!ctx)return;const t=Math.max(0,ctx.currentTime-origin),p=t%PERIOD,inhale=p<IN,phase=inhale?'in':'out';if(phase!==lastPhase){lastPhase=phase;label.textContent=inhale?'吸氣':'吐氣';guide.innerHTML=inhale?'想像植物的清新氣息，<br>正溫柔地進入你的身體。':'讓壓力、疲憊與灰暗感，<br>慢慢離開你的身體。';circle.classList.toggle('exhale',!inhale)}const fraction=inhale?p/IN:(p-IN)/OUT;circle.style.transform='scale('+(inhale?.72+.46*fraction:1.18-.46*fraction)+')';circle.style.opacity=inhale?.82+.18*fraction:1-.18*fraction;mist.style.opacity=inhale?'0':String(.48*(1-fraction));mist.style.transform='scale('+(inhale?.8:1+1.35*fraction)+')';raf=requestAnimationFrame(render)}
function stopScheduled(){clearInterval(scheduler);cancelAnimationFrame(raf);scheduler=0;raf=0;for(const o of active){try{o.stop()}catch(e){}}active=[]}
async function syncMusic(){music.volume=volume('musicVolume');if(musicEnabled&&running){try{await music.play();status.textContent='聲音引導進行中｜背景音樂已開啟'}catch(e){status.textContent='提示音正常；背景音樂未能播放，請確認 music.mp3'}}else{music.pause();if(running)status.textContent='聲音引導進行中｜僅播放提示音'}}
async function start(){if(running)return;const token=++runToken;try{if(!ctx)initAudio();await ctx.resume();if(token!==runToken)return;origin=ctx.currentTime-elapsed;nextCycle=Math.max(0,Math.ceil((elapsed-.000001)/PERIOD));running=true;lastPhase='';startBtn.textContent='暫停呼吸';schedule();scheduler=setInterval(schedule,75);render();syncMusic()}catch(e){status.textContent='音訊啟動失敗：'+e.message}}
function pause(){if(!running)return;runToken++;elapsed=Math.max(0,ctx.currentTime-origin);running=false;stopScheduled();music.pause();if(ctx){ctx.close().catch(()=>{});ctx=null;master=null}startBtn.textContent='繼續呼吸';status.textContent='已暫停，準備好再繼續'}
function reset(){runToken++;if(running)pause();elapsed=0;lastPhase='';label.textContent='準備開始';guide.innerHTML='想像植物的清新氣息，<br>正溫柔地進入你的身體。';circle.classList.remove('exhale');circle.style.transform='scale(.72)';circle.style.opacity='.82';mist.style.opacity='0';startBtn.textContent='開始呼吸';status.textContent='已重設，按「開始呼吸」即可開始'}
startBtn.addEventListener('click',()=>running?pause():start());$('restartBtn').addEventListener('click',()=>{reset();start()});musicBtn.addEventListener('click',()=>{musicEnabled=!musicEnabled;musicBtn.textContent=musicEnabled?'暫停背景音樂':'開啟背景音樂 🌿';syncMusic()});$('musicVolume').addEventListener('input',()=>{music.volume=volume('musicVolume')});
window.addEventListener('pagehide',()=>{if(running)pause()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running){status.textContent='已返回畫面，請確認音訊是否持續同步'}});
})();
</script>
</body>
</html>
